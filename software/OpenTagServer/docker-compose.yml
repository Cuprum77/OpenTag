services:
  opentag-server:
    build: .
    restart: unless-stopped
    # restart: no
    container_name: opentag-server
    ports:
      - 8888:8080
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/usr/bot/src
      - ./data:/usr/bot/data
    command: >-
      gunicorn --chdir ./src --bind 0.0.0.0:8080 --workers 1 --threads 8 --timeout 600 main:app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
