<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenTag Users</title>
  <link rel="stylesheet" href="/static/fontawesome/fontawesome.css">
  <link rel="stylesheet" href="/static/dashboard.css">
  <script src="/static/common.js"></script>
</head>
<body>
  {% set page = 'admin' %}{% include "_topbar.html" %}

  <main class="page-scroll">
    <div class="page">
      <section class="card">
        <div class="panel-head">
          <h2>Users</h2>
          <button type="button" id="new-user-btn" class="primary-btn"><i class="fas fa-user-plus" aria-hidden="true"></i> New user</button>
        </div>
        <p class="hint">Each user has their own keys, devices and location history. As the admin you can manage accounts, but you can't see any of their data.</p>
        <p id="admin-feedback" class="feedback" role="status"></p>
        <div id="users-list" class="table-wrap"><p class="hint">Loading…</p></div>
        <p class="hint">The admin password is set in <code>config.toml</code>.</p>
      </section>
    </div>
  </main>

  <script src="/static/admin.js"></script>
</body>
</html>
