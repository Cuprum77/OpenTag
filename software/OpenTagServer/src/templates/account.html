<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenTag Account</title>
  <link rel="stylesheet" href="/static/fontawesome/fontawesome.css">
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <h1><a href="/" class="home-link">OpenTag Server</a> · Account</h1>
    </div>
    <div class="topbar-right">
      <div class="topbar-divider"></div>
      <a href="/account" class="user-link" title="Account settings"><i class="fas fa-user-circle" aria-hidden="true"></i><strong>{{ username }}</strong></a>
      <button type="button" id="theme-toggle" class="theme-toggle-btn" title="Toggle dark mode">🌙</button>
      <form method="post" action="/auth/logout" class="signout-form">
        <button type="submit" class="signout-btn">Sign Out</button>
      </form>
    </div>
  </header>

  <main class="layout simple-page">
    <section class="card">
      <h2>Change password</h2>
      <form id="password-form" class="stack-form">
        <label for="current-password">Current password</label>
        <input id="current-password" type="password" required autocomplete="current-password">
        <label for="new-password">New password (min. 8 characters)</label>
        <input id="new-password" type="password" minlength="8" required autocomplete="new-password">
        <label for="confirm-password">Repeat new password</label>
        <input id="confirm-password" type="password" minlength="8" required autocomplete="new-password">
        <button type="submit">Change password</button>
      </form>
      <p id="account-feedback" class="hint"></p>
      <p class="hint">Changing your password signs out all other sessions. <a href="/">Back to the dashboard</a></p>
    </section>
  </main>

  <script src="/static/admin.js"></script>
</body>
</html>
