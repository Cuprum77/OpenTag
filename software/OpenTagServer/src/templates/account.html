<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenTag Account</title>
  <link rel="stylesheet" href="/static/fontawesome/fontawesome.css">
  <link rel="stylesheet" href="/static/dashboard.css">
  <script src="/static/common.js"></script>
</head>
<body>
  {% set page = 'account' %}{% include "_topbar.html" %}

  <main class="page-scroll">
    <div class="page narrow">
      <section class="card">
        <h2>Change password</h2>
        <form id="password-form" class="stack-form">
          <label class="field"><span class="field-label">Current password</span>
            <input id="current-password" type="password" required autocomplete="current-password"></label>
          <label class="field"><span class="field-label">New password</span>
            <input id="new-password" type="password" minlength="8" required autocomplete="new-password">
            <small>At least 8 characters.</small></label>
          <label class="field"><span class="field-label">Repeat new password</span>
            <input id="confirm-password" type="password" minlength="8" required autocomplete="new-password"></label>
          <div class="form-actions"><button type="submit" class="primary-btn">Change password</button></div>
        </form>
        <p id="account-feedback" class="feedback" role="status"></p>
        <p class="hint">Changing your password signs out all your other sessions.</p>
      </section>

      <section class="card">
        <h2>Sessions</h2>
        <p id="sessions-summary" class="hint">Loading…</p>
        <div class="form-actions">
          <button type="button" id="revoke-others-btn" hidden><i class="fas fa-sign-out-alt" aria-hidden="true"></i> Sign out other sessions</button>
        </div>
        <p id="sessions-feedback" class="feedback" role="status"></p>
      </section>
    </div>
  </main>

  <script src="/static/admin.js"></script>
</body>
</html>
