<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenTag Login</title>
  <link rel="stylesheet" href="/static/fontawesome/fontawesome.css">
  <link rel="stylesheet" href="/static/dashboard.css">
  <script src="/static/common.js"></script>
</head>
<body class="login-page">
  <button type="button" class="icon-btn theme-toggle-btn login-theme" title="Switch theme" aria-label="Switch theme"></button>
  <form class="card login-card" method="post" action="/auth/login">
    <div class="login-brand"><span class="brand-mark" aria-hidden="true"><i class="fas fa-tag"></i></span><h1>OpenTag Server</h1></div>
    {% if error %}
    <p class="login-error" role="alert">{{ error }}</p>
    {% endif %}
    <label class="field"><span class="field-label">Username</span>
      <input id="username" name="username" value="{{ username or '' }}" required autocomplete="username" autofocus></label>
    <label class="field"><span class="field-label">Password</span>
      <input id="password" name="password" type="password" required autocomplete="current-password"></label>
    <button type="submit" class="primary-btn login-submit">Sign in</button>
  </form>
</body>
</html>
